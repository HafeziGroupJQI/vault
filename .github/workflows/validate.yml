name: validate vault

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate

  # tell the website repo to rebuild whenever public content changes
  dispatch:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.VAULT_DISPATCH_TOKEN }}
          repository: HafeziGroupJQI/hafezigroupjqi.github.io
          event-type: vault-updated
          client-payload: '{"sha": "${{ github.sha }}"}'
